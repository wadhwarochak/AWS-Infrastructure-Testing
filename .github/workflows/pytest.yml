# .github/workflows/app.yaml

name: AWS Test Suite With Pytest

on:
  push:
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

permissions:
  contents: read

jobs:
  AWSDeploymentTesting:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v7

      # Step 2: Configure AWS credentials using GitHub repository secrets
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 3: Verify AWS authentication
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # Step 4: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Step 5: Install Python dependencies
      - name: Install required Python modules
        run: |
          python -m pip install --upgrade pip
          pip install boto3 moto pytest pytest-github-report pytest-cov coverage pre-commit

      # Step 6: Execute AWS test cases
      - name: Run AWS Test Suite
        id: pytest
        continue-on-error: true
        working-directory: ./AWSTestExecutions
        run: |
          pwd
          pytest --github-report -v --cov=AWSTestCases --cov-report xml:coverage.xml --junitxml=junit-results.xml

      - name: Send Email Test Report
        if: always()
        run: python send_test_report.py
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}


      # Step 7: Upload coverage to Codecov
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./AWSTestExecutions/coverage.xml

      # Step 8: Publish coverage results
      - name: Publish Code Coverage Results
        uses: 5monkeys/cobertura-action@master
        with:
          path: ${{ github.workspace }}/AWSTestExecutions/coverage.xml
          minimum_coverage: 75


      - name: Fail workflow if tests failed
        if: steps.pytest.outcome == 'failure'
        run: exit 1